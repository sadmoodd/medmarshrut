
services:
  - type: web
    name: medmarshrut-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medmarshrut-db
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: HASH_SALT
        generateValue: true
      - key: CORE_URL
        value: https://tm-test-yakut.hostco.ru
      - key: CORE_SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://medmarshrut-web.onrender.com

  - type: web
    name: medmarshrut-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://medmarshrut-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: medmarshrut-db
    plan: free
    postgresMajorVersion: "16"
